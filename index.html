<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>PFIM Responsive Nav</title>
  <link rel="stylesheet" href="statics/css/style.css" />
</head>
<body>
  <header class="site-header">
    <nav class="navbar">
      <!-- Logo -->
      <a href="#" class="logo">
        <img src="statics/img/churchlogo.svg" alt="PFIM Logo" />
        <span>PFIM</span>
      </a>

      <!-- Hamburger toggle for mobile -->
      <input
        type="checkbox"
        id="nav-toggle"
        class="nav-toggle"
        aria-label="Toggle navigation"
      />
      <label for="nav-toggle" class="nav-toggle-label">
        <span></span>
      </label>

      <!-- Menu items + Enquire button -->
      <div class="nav-menu">
        <ul class="nav-list">
          <li><a href="#">Home</a></li>
          <li><a href="#">About us</a></li>
          <li><a href="#">Contact Us</a></li>
          <li><a href="#">Events</a></li>
        </ul>
        <a href="#" class="btn-enquire">ENQUIRE</a>
      </div>
    </nav>
  </header>
</body>
</html>
